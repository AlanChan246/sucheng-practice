<!doctype html>
<html lang="zh-Hant" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var redirect = sessionStorage.getItem('gh-pages-redirect')
        // Restore deep link after GitHub Pages 404 fallback.
        // Include a history idx so React Router's browser history stays in sync.
        if (redirect) {
          sessionStorage.removeItem('gh-pages-redirect')
          history.replaceState({ idx: 0 }, '', redirect)
        }
        // Migrate leftover HashRouter URLs like /levels#/practice → /practice
        if (location.hash.indexOf('#/') === 0) {
          var base = '/sucheng-practice'
          var route = location.hash.slice(1)
          history.replaceState({ idx: 0 }, '', base + route + location.search)
        }
      })()
    </script>
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="給小學生、中學生的速成輸入法學習與練習網站"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>速成練習</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
